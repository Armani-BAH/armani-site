<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alterations Connection Test</title>
<style>
  :root { --bg:#f5f4f1; --surface:#fff; --ink:#141414; --muted:#6b6760; --line:#dedad3; --ok:#1f7a3a; --bad:#b3261e; --warn:#8a5a00;
          --font:"Helvetica Neue",Arial,system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121212; --surface:#1d1d1d; --ink:#f2f1ee; --muted:#a19d96; --line:#33312e; --ok:#5fc27a; --bad:#ff8a80; --warn:#f0c060; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font);
         padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); }
  main { max-width:460px; margin:0 auto; display:grid; gap:18px; }
  .brand { font-weight:700; letter-spacing:.22em; font-size:15px; text-transform:uppercase; }
  h1 { font-size:26px; margin:2px 0 0; }
  p { margin:0; color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px; }
  label { font-size:13px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  input { width:100%; font:15px var(--mono); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  button { font:600 17px var(--font); padding:15px; border-radius:10px; border:0; background:var(--ink); color:var(--bg); cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--ink); font-size:15px; padding:12px; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--muted); outline-offset:2px; }
  #result { font-size:22px; font-weight:700; }
  #result.ok { color:var(--ok); } #result.bad { color:var(--bad); } #result.warn { color:var(--warn); }
  #detail { color:var(--ink); }
  ul { margin:0; padding-left:20px; }
  #log { font:12px/1.5 var(--mono); color:var(--muted); white-space:pre-wrap; word-break:break-word; margin:0; }
</style>
</head>
<body>
<main>
  <div>
    <div class="brand">Emporio Armani · Marassi</div>
    <h1>Alterations connection test</h1>
  </div>

  <div class="card">
    <p>Checks whether this page can open the Alterations list in your company Microsoft account. It only reads; nothing is changed.</p>
    <div id="result" role="status">Not tested yet.</div>
    <div id="detail"></div>
    <button id="signIn" type="button">Sign in with work account</button>
    <button id="signOut" class="secondary" type="button" hidden>Sign out</button>
  </div>

  <div class="card">
    <label for="cid">App ID (Application client ID)</label>
    <input id="cid" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    <pre id="log"></pre>
  </div>
</main>

<script src="../../assets/js/msal-browser-3.28.1.min.js"></script>
<script>
(function () {
  var TENANT = 'f73b84d8-27ae-4c31-a606-000b08cc2fa4';
  var SITE_PATH = '/personal/jasim_almudaweb_giorgioarmani_bh';
  var SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
  var DEFAULT_CID = '';

  var $ = function (id) { return document.getElementById(id); };
  var resultEl = $('result'), detailEl = $('detail'), logEl = $('log'), cidEl = $('cid');
  function log(m) { logEl.textContent += m + '\n'; }
  function result(m, cls, detail) { resultEl.textContent = m; resultEl.className = cls || ''; detailEl.innerHTML = detail || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var qs = new URLSearchParams(location.search);
  var cid = (qs.get('id') || store('altClientId') || DEFAULT_CID || '').trim();
  if (qs.get('id')) store('altClientId', cid);
  cidEl.value = cid;
  cidEl.addEventListener('change', function () { store('altClientId', cidEl.value.trim()); location.reload(); });

  if (!cid) { result('Paste the App ID below first.', 'warn'); $('signIn').disabled = true; return; }

  var app = new msal.PublicClientApplication({
    auth: { clientId: cid, authority: 'https://login.microsoftonline.com/' + TENANT, redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: 'localStorage' }
  });

  function explain(e) {
    var s = (e && (e.errorMessage || e.message)) || String(e);
    log('Error: ' + s);
    if (/AADSTS65001|AADSTS90094|admin approval|consent/i.test(s))
      return result('Blocked', 'bad', 'Armani needs an administrator to approve this. Option B needs IT, so we go with Option A (slim the Power Apps app).');
    if (/AADSTS700016|AADSTS50011|redirect/i.test(s))
      return result('Setup problem', 'warn', 'The App ID or the redirect address in the registration is not right. Send a screenshot to Claude.');
    if (/AADSTS53003|AADSTS530/i.test(s))
      return result('Blocked by company policy', 'bad', 'Company sign-in rules block this page. We go with Option A.');
    result('Something went wrong', 'warn', 'Send a screenshot of this page to Claude.');
  }

  function graph(token, path) {
    return fetch('https://graph.microsoft.com/v1.0' + path, { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error((j.error && (j.error.code + ': ' + j.error.message)) || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j; }); });
  }

  function runTest(account) {
    $('signIn').hidden = true; $('signOut').hidden = false;
    result('Checking…');
    log('Signed in as ' + account.username);
    var token;
    return app.acquireTokenSilent({ scopes: SCOPES, account: account })
      .catch(function (e) { if (e instanceof msal.InteractionRequiredAuthError) return app.acquireTokenRedirect({ scopes: SCOPES, account: account }); throw e; })
      .then(function (r) { token = r.accessToken; log('Token OK'); return graph(token, '/sites/root?$select=siteCollection,webUrl'); })
      .then(function (root) {
        var host = root.siteCollection.hostname;                 // e.g. company.sharepoint.com
        var myHost = host.replace(/^([^.]+)\./, '$1-my.');       // personal sites live on company-my.sharepoint.com
        log('Root site ' + host + ' → ' + myHost);
        return graph(token, '/sites/' + myHost + ':' + SITE_PATH + '?$select=id,webUrl');
      })
      .then(function (site) {
        log('Site OK');
        return graph(token, '/sites/' + site.id + '/lists?$select=id,displayName').then(function (l) {
          var list = (l.value || []).filter(function (x) { return x.displayName === 'Alterations'; })[0];
          if (!list) throw new Error('Alterations list not found');
          return graph(token, '/sites/' + site.id + '/lists/' + list.id + '/items?$expand=fields($select=Title,Status,PromisedDate)&$top=200');
        });
      })
      .then(function (items) {
        var rows = (items.value || []).map(function (i) { return i.fields || {}; });
        rows.sort(function (a, b) { return String(b.Title).localeCompare(String(a.Title)); });
        var counts = {};
        rows.forEach(function (f) { var s = f.Status || '—'; counts[s] = (counts[s] || 0) + 1; });
        var html = '<p>' + rows.length + ' tickets found in your Alterations list.</p><ul>' +
          Object.keys(counts).map(function (s) { return '<li>' + esc(s) + ': ' + counts[s] + '</li>'; }).join('') + '</ul>' +
          '<p style="margin-top:8px">Latest: ' + rows.slice(0, 3).map(function (f) { return esc(f.Title); }).join(', ') + '</p>';
        result('Connected ✓', 'ok', html + '<p style="margin-top:8px">Option B works. Tell Claude “Connected”.</p>');
      })
      .catch(function (e) {
        if (e && e.status === 403) { log('Error: ' + e.message); return result('Signed in, but no access to the list', 'warn', 'Send a screenshot to Claude.'); }
        explain(e);
      });
  }

  app.initialize().then(function () { return app.handleRedirectPromise(); }).then(function (resp) {
    var account = (resp && resp.account) || app.getAllAccounts()[0];
    if (account) runTest(account);
  }).catch(explain);

  $('signIn').addEventListener('click', function () {
    result('Opening Microsoft sign-in…');
    app.loginRedirect({ scopes: SCOPES, prompt: 'select_account' }).catch(explain);
  });
  $('signOut').addEventListener('click', function () {
    var a = app.getAllAccounts()[0];
    app.logoutRedirect({ account: a, postLogoutRedirectUri: location.origin + location.pathname });
  });
})();
</script>
</body>
</html>
