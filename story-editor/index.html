<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Edit my story | Emporio Armani Marassi</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<style>
  @font-face{font-family:"Jost";font-weight:300;font-display:swap;src:url("../assets/fonts/jost-latin-300-normal.woff2") format("woff2");}
  @font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url("../assets/fonts/jost-latin-400-normal.woff2") format("woff2");}
  @font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url("../assets/fonts/jost-latin-500-normal.woff2") format("woff2");}
  :root{--ink:#000;--stone:#66615b;--line:#dad6d0;--greige:#f0eeeb;--paper:#fff;--ok:#1b6e3c;--bad:#a4262c;--font:"Jost","Helvetica Neue",Arial,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;padding-bottom:92px;}
  button,input,select{font:inherit;color:inherit;}
  button{background:none;border:0;cursor:pointer;padding:0;}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  [hidden]{display:none !important;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 0;}
  .top img{height:18px;display:block;}
  .link{font-size:.85rem;color:var(--stone);text-decoration:underline;text-underline-offset:3px;}
  h1{font-weight:300;font-size:1.8rem;margin:34px 0 8px;letter-spacing:-.01em;}
  h2{font-weight:500;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:34px 0 12px;}
  p.note{color:var(--stone);font-size:.95rem;line-height:1.55;margin:0 0 18px;}
  label.f{display:block;font-size:.8rem;color:var(--stone);margin:14px 0 6px;}
  input,select{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:0;}
  .btn{height:46px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);font-size:.9rem;letter-spacing:.04em;}
  .btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .btn:disabled{opacity:.45;cursor:default;}
  .msg{margin:14px 0 0;font-size:.9rem;line-height:1.45;}
  .msg.bad{color:var(--bad);} .msg.ok{color:var(--ok);}
  .hello{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .hello b{font-weight:500;}
  .who-edit{margin-top:14px;}

  .sec{border:1px solid var(--line);margin:0 0 14px;padding:14px;}
  .sec-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sec-head select{flex:1;min-width:150px;}
  .custom{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .custom input{flex:1;min-width:140px;}
  .icon{width:40px;height:40px;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;}
  .icon:disabled{opacity:.3;cursor:default;}
  .count{font-size:.78rem;color:var(--stone);margin:10px 0 8px;}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .th{flex:0 0 auto;width:78px;position:relative;}
  .th img{width:78px;height:98px;object-fit:cover;background:var(--greige);display:block;}
  .th small{display:block;font-size:.66rem;line-height:1.2;margin-top:3px;max-height:2.4em;overflow:hidden;}
  .th .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px var(--line);font-size:.8rem;line-height:22px;text-align:center;}
  .th .mv{display:flex;justify-content:space-between;margin-top:2px;}
  .th .mv button{width:34px;height:22px;font-size:.8rem;box-shadow:inset 0 0 0 1px var(--line);}
  .th .mv button:disabled{opacity:.25;}
  .empty{font-size:.85rem;color:var(--stone);padding:6px 0;}

  .pick-bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .filters .full{grid-column:1/-1;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px;}
  .tile{position:relative;text-align:left;}
  .tile img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--greige);display:block;}
  .tile small{display:block;font-size:.7rem;line-height:1.25;margin-top:4px;}
  .tile small i{color:var(--stone);font-style:normal;display:block;}
  .tile.on img{outline:3px solid var(--ink);outline-offset:-3px;}
  .tile .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;display:none;align-items:center;justify-content:center;}
  .tile.on .tick{display:flex;}
  .more{display:block;margin:18px auto 0;}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));}
  .bar .wrap{display:flex;align-items:center;gap:10px;}
  .bar .state{flex:1;font-size:.78rem;line-height:1.3;color:var(--stone);min-width:0;}
  .bar .btn{padding:0 16px;flex:none;}
  .bar .state.dirty{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../"><img src="../assets/logo/emporio-armani-logo.png" alt="Emporio Armani"></a><span id="topRight"></span></div>

  <!-- ============ SIGN IN ============ -->
  <section id="signin">
    <h1>Edit my story</h1>
    <p class="note">The story is the row of round pictures at the top of the website. Sign in to choose which pieces your clients see when they open your personal link.</p>
    <label class="f" for="who">Who are you?</label>
    <select id="who"></select>
    <label class="f" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p style="margin-top:18px"><button class="btn" id="signinBtn" type="button">Sign in</button></p>
    <p class="msg" id="signinMsg"></p>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="editor" hidden>
    <h1>Edit my story</h1>
    <div class="hello"><span>Signed in as <b id="meName"></b></span><span><button class="link" id="pwBtn" type="button">Change password</button> &nbsp; <button class="link" id="outBtn" type="button">Sign out</button></span></div>
    <div class="who-edit" id="whoEdit" hidden>
      <label class="f" for="target">You are editing</label>
      <select id="target"></select>
    </div>
    <p class="msg" id="loadMsg"></p>
    <p class="note" id="intro" style="margin-top:14px"></p>
    <p id="startBtns"></p>

    <h2>Sections</h2>
    <div id="sections"></div>
    <p><button class="btn ghost" id="addSec" type="button">+ Add a section</button></p>

    <h2>Choose pieces</h2>
    <div class="pick-bar">
      <label class="f" for="into" style="margin-top:0">Adding to</label>
      <select id="into"></select>
      <div class="filters">
        <input id="q" class="full" type="search" placeholder="Search name, code or colour code" aria-label="Search">
        <select id="dep" aria-label="Department"></select>
        <select id="cat" aria-label="Category"></select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn ghost more" id="more" type="button" hidden>Show more</button>
  </section>
</div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <span class="state" id="state">No changes</span>
    <button class="btn ghost" id="resetBtn" type="button" hidden>Remove my story</button>
    <button class="btn" id="publishBtn" type="button">Publish</button>
  </div>
</div>

<script src="../js/advisors-data.js"></script>
<script>
(function () {
  "use strict";
  var API_KEY = "AIzaSyAI2Ya5df_RMPmhHZUhoxX9iXSw_aoUeXg", PROJECT = "eawishlist";
  var DOCS = "https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents";
  var DOMAIN = "@stories.eawishlist.com";
  var MANAGERS = ["jasim", "ahmed"];
  var MAX_SECTIONS = 8, MAX_ITEMS = 12;
  var PHOTO_COPIES = "https://raw.githubusercontent.com/Armani-BAH/Armani-images/main/img/";
  var PRESETS = [
    ["Women", "نساء"], ["Men", "رجال"], ["Girls", "بنات"], ["Boys", "أولاد"], ["Kids", "أطفال"],
    ["Bags & leather", "حقائب ومنتجات جلدية"], ["Shoes", "أحذية"], ["Accessories", "إكسسوارات"],
    ["Eyewear", "نظارات"], ["Perfume", "عطور"], ["New in", "وصل حديثاً"], ["My favourites", "مفضلاتي"]
  ];
  var DEPS = [["", "All departments"], ["WOMAN", "Women"], ["MAN", "Men"], ["GIRL", "Girls"], ["BOY", "Boys"], ["UNISEX JUNIOR", "Unisex junior"]];
  var $ = function (id) { return document.getElementById(id); };
  var ADV = window.EA_ADVISORS || [];
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var title = function (s) { s = String(s || "").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };

  /* ---------- sign in (Firebase Authentication over plain web requests) ---------- */
  var sess = null;   /* { id, email, idToken, refreshToken, exp } */
  try { sess = JSON.parse(localStorage.getItem("ea_editor") || "null"); } catch (e) {}
  function saveSess() { try { localStorage.setItem("ea_editor", JSON.stringify(sess)); } catch (e) {} }

  var who = $("who");
  who.innerHTML = ADV.map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + "</option>"; }).join("");

  function authErr(code) {
    if (/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(code)) return "Wrong password, or your login has not been created yet. Ask Jasim.";
    if (/TOO_MANY/.test(code)) return "Too many tries. Wait a few minutes and try again.";
    if (/WEAK_PASSWORD/.test(code)) return "The new password is too short (at least 6 characters).";
    if (/OPERATION_NOT_ALLOWED/.test(code)) return "Email sign-in is not switched on in Firebase yet.";
    return "Something went wrong (" + code + "). Check your internet and try again.";
  }
  function post(url, body, form) {
    return fetch(url, { method: "POST", headers: { "Content-Type": form ? "application/x-www-form-urlencoded" : "application/json" }, body: form ? body : JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || "ERROR"); return j; }); });
  }
  function signIn() {
    var id = who.value, pw = $("pw").value; $("signinMsg").className = "msg";
    if (!pw) { $("signinMsg").className = "msg bad"; $("signinMsg").textContent = "Type your password."; return; }
    $("signinBtn").disabled = true; $("signinMsg").textContent = "Signing in…";
    post("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + API_KEY, { email: id + DOMAIN, password: pw, returnSecureToken: true })
      .then(function (j) {
        sess = { id: id, email: id + DOMAIN, idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (+j.expiresIn) * 1000 };
        saveSess(); $("pw").value = ""; $("signinMsg").textContent = ""; enter();
      })
      .catch(function (e) { $("signinMsg").className = "msg bad"; $("signinMsg").textContent = authErr(e.message); })
      .then(function () { $("signinBtn").disabled = false; });
  }
  function token() {
    if (sess.exp - Date.now() > 60000) return Promise.resolve(sess.idToken);
    return post("https://securetoken.googleapis.com/v1/token?key=" + API_KEY, "grant_type=refresh_token&refresh_token=" + encodeURIComponent(sess.refreshToken), true)
      .then(function (j) { sess.idToken = j.id_token; sess.refreshToken = j.refresh_token; sess.exp = Date.now() + (+j.expires_in) * 1000; saveSess(); return sess.idToken; });
  }
  function signOut() { sess = null; try { localStorage.removeItem("ea_editor"); } catch (e) {} location.reload(); }
  $("signinBtn").addEventListener("click", signIn);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") signIn(); });
  $("outBtn").addEventListener("click", signOut);
  $("pwBtn").addEventListener("click", function () {
    var np = prompt("Type your new password (at least 6 characters):"); if (!np) return;
    token().then(function (tk) { return post("https://identitytoolkit.googleapis.com/v1/accounts:update?key=" + API_KEY, { idToken: tk, password: np, returnSecureToken: true }); })
      .then(function (j) { sess.idToken = j.idToken; sess.refreshToken = j.refreshToken; sess.exp = Date.now() + (+j.expiresIn) * 1000; saveSess(); flash("Password changed.", true); })
      .catch(function (e) { flash(authErr(e.message), false); });
  });

  /* ---------- catalogue (for choosing pieces) ---------- */
  var PRODUCTS = [], BYKEY = {};
  var pKey = function (p) { return p.styleCode + "-" + p.fabricCode + "-" + p.colorCode; };
  var sized = function (u, w) { return String(u).replace(/w_\d+/, "w_" + w).replace("q_auto:best", "q_auto"); };
  function copyName(src) {
    try { var u = new URL(src); var base = decodeURIComponent(u.pathname.split("/").pop() || "").replace(/\.[A-Za-z0-9]{2,5}$/, ""); return base.replace(/[^A-Za-z0-9._-]/g, "_") + ".jpg"; } catch (e) { return null; }
  }
  document.addEventListener("error", function (e) {
    var img = e.target; if (!(img instanceof HTMLImageElement) || img.dataset.copy) return;
    var src = img.getAttribute("src") || ""; if (!/^https?:/.test(src) || src.indexOf(PHOTO_COPIES) === 0) return;
    var n = copyName(src); if (!n) return; img.dataset.copy = "1"; img.src = PHOTO_COPIES + encodeURIComponent(n);
  }, true);
  var catalogue = fetch("../data/products.json").then(function (r) { return r.json(); }).then(function (d) {
    PRODUCTS = d.filter(function (p) { return p.images && p.images.length; });
    PRODUCTS.forEach(function (p) {
      p.dep = p.gender === "UNISEX" ? "MAN" : p.gender;
      if (p.category === "TEXTILE ACCESSORIES") p.category = "SOFT ACCESSORIES";
      p.isNew = /_FW2026\./.test(p.images[0]);
      p.hay = [p.name, p.styleCode, p.fabricCode, p.colorCode, p.category, p.family, p.sub].join(" ").toLowerCase();
      BYKEY[pKey(p)] = p;
    });
    PRODUCTS.sort(function (a, b) { return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0); });
    var cats = {}; PRODUCTS.forEach(function (p) { cats[p.category] = 1; });
    $("dep").innerHTML = DEPS.map(function (d) { return '<option value="' + d[0] + '">' + d[1] + "</option>"; }).join("");
    $("cat").innerHTML = '<option value="">All categories</option>' + Object.keys(cats).sort().map(function (c) { return '<option value="' + esc(c) + '">' + esc(title(c)) + "</option>"; }).join("");
  });

  /* ---------- the story being edited ---------- */
  var docId = null, sections = [], dirty = false, hasOwn = false;
  var firstName = function (id) { var a = ADV.filter(function (x) { return x.id === id; })[0]; return a ? a.name.split(" ")[0] : id; };

  function flash(text, ok) { var m = $("loadMsg"); m.className = "msg " + (ok ? "ok" : "bad"); m.textContent = text; if (ok) setTimeout(function () { if (m.textContent === text) m.textContent = ""; }, 5000); }
  function setDirty(v) { dirty = v; var s = $("state"); s.textContent = v ? "Not published yet" : "No changes"; s.className = "state" + (v ? " dirty" : ""); }
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  function readDoc(id) {
    return fetch(DOCS + "/stories/" + id + "?key=" + API_KEY, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { try { return JSON.parse(d.fields.data.stringValue).sections || null; } catch (e) { return null; } })
      .catch(function () { return null; });
  }
  function fromJsonFile(id) {
    return fetch("../data/stories.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      return id === "default" ? (d["default"] && d["default"].sections) : (d.advisors && d.advisors[id] && d.advisors[id].sections);
    }).catch(function () { return null; });
  }
  function boutiqueSections() { return readDoc("default").then(function (s) { return s || fromJsonFile("default"); }); }

  function load(id) {
    docId = id; sections = []; setDirty(false); hasOwn = false;
    $("loadMsg").textContent = "Loading…"; $("loadMsg").className = "msg";
    $("resetBtn").hidden = id === "default";
    return Promise.all([readDoc(id), catalogue]).then(function (r) {
      return r[0] || fromJsonFile(id);
    }).then(function (s) {
      hasOwn = !!(s && s.length);
      sections = (s || []).map(function (x) { return { title: x.title || "", titleAr: x.titleAr || "", items: (x.items || []).filter(function (k) { return BYKEY[k]; }) }; });
      $("loadMsg").textContent = "";
      var mine = id === sess.id;
      $("intro").textContent = hasOwn
        ? (id === "default" ? "This is the boutique story that everyone sees, unless an advisor has made their own." : "This is your story. Change it below and press Publish. Clients who open your personal link see it straight away.")
        : (id === "default" ? "No boutique story has been published yet." : "You don't have your own story yet, so your clients see the boutique story. Start from the boutique story, or start empty.");
      $("startBtns").innerHTML = hasOwn ? "" : '<button class="btn ghost" id="copyDef" type="button">Start from the boutique story</button>';
      var cd = $("copyDef"); if (cd) cd.addEventListener("click", function () {
        boutiqueSections().then(function (b) { sections = (b || []).map(function (x) { return { title: x.title, titleAr: x.titleAr || "", items: (x.items || []).filter(function (k) { return BYKEY[k]; }) }; }); $("startBtns").innerHTML = ""; setDirty(true); paint(); });
      });
      paint();
    });
  }

  /* ---------- drawing the editor ---------- */
  function presetIndex(s) { for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i][0] === s.title) return i; return -1; }
  function paint() {
    $("sections").innerHTML = sections.map(function (s, i) {
      var pi = presetIndex(s);
      var opts = PRESETS.map(function (p, k) { return '<option value="' + k + '"' + (k === pi ? " selected" : "") + ">" + esc(p[0]) + "</option>"; }).join("") +
        '<option value="c"' + (pi < 0 ? " selected" : "") + ">Other name…</option>";
      var thumbs = s.items.map(function (k, j) {
        var p = BYKEY[k];
        return '<div class="th"><img src="' + esc(sized(p.images[0], 200)) + '" alt="" loading="lazy"><button class="x" data-act="rm" data-i="' + i + '" data-j="' + j + '" aria-label="Remove">✕</button>' +
          '<small>' + esc(p.name) + '</small><div class="mv"><button data-act="l" data-i="' + i + '" data-j="' + j + '"' + (j === 0 ? " disabled" : "") + '>◀</button><button data-act="r" data-i="' + i + '" data-j="' + j + '"' + (j === s.items.length - 1 ? " disabled" : "") + '>▶</button></div></div>';
      }).join("");
      return '<div class="sec"><div class="sec-head"><select data-act="preset" data-i="' + i + '" aria-label="Section name">' + opts + '</select>' +
        '<button class="icon" data-act="up" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">↑</button>' +
        '<button class="icon" data-act="down" data-i="' + i + '"' + (i === sections.length - 1 ? " disabled" : "") + ' aria-label="Move down">↓</button>' +
        '<button class="icon" data-act="del" data-i="' + i + '" aria-label="Delete section">🗑</button></div>' +
        (pi < 0 ? '<div class="custom"><input data-act="t" data-i="' + i + '" value="' + esc(s.title) + '" placeholder="Name (English)"><input data-act="tar" data-i="' + i + '" value="' + esc(s.titleAr) + '" placeholder="الاسم بالعربية (optional)" dir="rtl"></div>' : "") +
        '<div class="count">' + s.items.length + " of " + MAX_ITEMS + " pieces</div>" +
        (thumbs ? '<div class="thumbs">' + thumbs + "</div>" : '<div class="empty">No pieces yet. Choose them below.</div>') + "</div>";
    }).join("") || '<p class="empty">No sections yet.</p>';
    var cur = $("into").value;
    $("into").innerHTML = sections.map(function (s, i) { return '<option value="' + i + '">' + esc(s.title || "Section " + (i + 1)) + "</option>"; }).join("") || '<option value="">Add a section first</option>';
    if (cur && sections[+cur]) $("into").value = cur;
    $("addSec").disabled = sections.length >= MAX_SECTIONS;
    grid();
  }

  $("sections").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
    var i = +b.dataset.i, j = +b.dataset.j, a = b.dataset.act, s = sections[i];
    if (a === "rm") s.items.splice(j, 1);
    else if (a === "l" && j > 0) { var x = s.items[j]; s.items[j] = s.items[j - 1]; s.items[j - 1] = x; }
    else if (a === "r" && j < s.items.length - 1) { var y = s.items[j]; s.items[j] = s.items[j + 1]; s.items[j + 1] = y; }
    else if (a === "up" && i > 0) { sections.splice(i - 1, 0, sections.splice(i, 1)[0]); }
    else if (a === "down" && i < sections.length - 1) { sections.splice(i + 1, 0, sections.splice(i, 1)[0]); }
    else if (a === "del") { if (!confirm("Delete the section \"" + (s.title || "Section") + "\"?")) return; sections.splice(i, 1); }
    else return;
    setDirty(true); paint();
  });
  $("sections").addEventListener("change", function (e) {
    var el = e.target, i = +el.dataset.i; if (el.dataset.act !== "preset") return;
    var s = sections[i];
    if (el.value === "c") { s.title = ""; s.titleAr = ""; } else { s.title = PRESETS[+el.value][0]; s.titleAr = PRESETS[+el.value][1]; }
    setDirty(true); paint();
  });
  $("sections").addEventListener("input", function (e) {
    var el = e.target, i = +el.dataset.i; if (el.dataset.act === "t") { sections[i].title = el.value; var op = $("into").options[i]; if (op) op.textContent = el.value || "Section " + (i + 1); }
    else if (el.dataset.act === "tar") sections[i].titleAr = el.value; else return;
    setDirty(true);
  });
  $("addSec").addEventListener("click", function () {
    if (sections.length >= MAX_SECTIONS) return;
    var used = sections.map(function (s) { return s.title; }), p = PRESETS.filter(function (x) { return used.indexOf(x[0]) < 0; })[0] || PRESETS[0];
    sections.push({ title: p[0], titleAr: p[1], items: [] }); setDirty(true); paint(); $("into").value = String(sections.length - 1); grid();
  });

  /* ---------- the piece picker ---------- */
  var shown = 48, matches = [];
  function grid() {
    var q = $("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean), dep = $("dep").value, cat = $("cat").value;
    matches = PRODUCTS.filter(function (p) { return (!dep || p.dep === dep) && (!cat || p.category === cat) && q.every(function (w) { return p.hay.indexOf(w) >= 0; }); });
    var tgt = sections[+$("into").value], inSet = {}; if (tgt) tgt.items.forEach(function (k) { inSet[k] = 1; });
    $("grid").innerHTML = matches.slice(0, shown).map(function (p) {
      var k = pKey(p);
      return '<button type="button" class="tile' + (inSet[k] ? " on" : "") + '" data-k="' + esc(k) + '"><img src="' + esc(sized(p.images[0], 300)) + '" alt="" loading="lazy"><span class="tick">✓</span><small>' + esc(p.name) + "<i>" + esc(p.styleCode + " · " + p.colorCode) + "</i></small></button>";
    }).join("") || '<p class="empty" style="grid-column:1/-1">No pieces match.</p>';
    $("more").hidden = matches.length <= shown;
  }
  $("grid").addEventListener("click", function (e) {
    var t = e.target.closest(".tile"); if (!t) return;
    var s = sections[+$("into").value]; if (!s) { flash("Add a section first.", false); return; }
    var k = t.dataset.k, at = s.items.indexOf(k);
    if (at >= 0) s.items.splice(at, 1);
    else { if (s.items.length >= MAX_ITEMS) { flash("A section can hold " + MAX_ITEMS + " pieces. Remove one first.", false); return; } s.items.push(k); }
    setDirty(true); paint();
  });
  $("more").addEventListener("click", function () { shown += 48; grid(); });
  var qt; $("q").addEventListener("input", function () { clearTimeout(qt); qt = setTimeout(function () { shown = 48; grid(); }, 200); });
  ["dep", "cat"].forEach(function (id) { $(id).addEventListener("change", function () { shown = 48; grid(); }); });
  $("into").addEventListener("change", grid);

  /* ---------- publish / reset ---------- */
  function liveLink() { return docId === "default" ? "www.eawishlist.com" : "www.eawishlist.com/" + docId; }
  $("publishBtn").addEventListener("click", function () {
    var clean = sections.filter(function (s) { return s.items.length; }).map(function (s) {
      var pi = presetIndex(s); return { title: (s.title || "").trim() || "Selection", titleAr: (s.titleAr || "").trim(), items: s.items };
    });
    if (!clean.length) { flash("Add at least one piece to a section first.", false); return; }
    $("publishBtn").disabled = true; flash("Publishing…", true);
    token().then(function (tk) {
      return fetch(DOCS + "/stories/" + docId + "?updateMask.fieldPaths=data&updateMask.fieldPaths=updated&key=" + API_KEY, {
        method: "PATCH", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tk },
        body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify({ sections: clean }) }, updated: { stringValue: new Date().toISOString() } } })
      });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 403 ? "NOT_ALLOWED" : "HTTP " + r.status);
      sections = clean; hasOwn = true; setDirty(false); paint();
      flash("Published. Your clients now see it at " + liveLink() + " (it can take a minute on a phone that already had the page open).", true);
    }).catch(function (e) { flash(e.message === "NOT_ALLOWED" ? "Not allowed. Sign out and sign in again, or ask Jasim." : "Could not publish (" + e.message + "). Check your internet and try again.", false); })
      .then(function () { $("publishBtn").disabled = false; });
  });
  $("resetBtn").addEventListener("click", function () {
    if (!confirm("Remove your own story? Your clients will see the boutique story again.")) return;
    token().then(function (tk) { return fetch(DOCS + "/stories/" + docId + "?key=" + API_KEY, { method: "DELETE", headers: { Authorization: "Bearer " + tk } }); })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); flash("Done. Your clients see the boutique story again.", true); return load(docId); })
      .catch(function (e) { flash("Could not remove it (" + e.message + ").", false); });
  });

  /* ---------- start ---------- */
  function enter() {
    $("signin").hidden = true; $("editor").hidden = false; $("bar").hidden = false;
    $("meName").textContent = (ADV.filter(function (a) { return a.id === sess.id; })[0] || { name: sess.id }).name;
    var mgr = MANAGERS.indexOf(sess.id) >= 0;
    $("whoEdit").hidden = !mgr;
    if (mgr) {
      $("target").innerHTML = '<option value="' + sess.id + '">My own story</option><option value="default">The boutique story (everyone)</option>' +
        ADV.filter(function (a) { return a.id !== sess.id; }).map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + "'s story</option>"; }).join("");
      $("target").onchange = function () { if (dirty && !confirm("You have changes that are not published. Switch anyway?")) { $("target").value = docId; return; } load($("target").value); };
    }
    load(sess.id);
  }
  if (sess && sess.refreshToken) enter();
})();
</script>
</body>
</html>
