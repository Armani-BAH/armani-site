<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Advisor links | Emporio Armani Marassi</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0 auto; padding: 24px 16px; max-width: 640px; color: #111; background: #fff; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  p.note { color: #555; font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  .row { border-top: 1px solid #ddd; padding: 14px 0; }
  .name { font-size: 16px; }
  .role { color: #666; font-size: 13px; margin-top: 2px; }
  .url { font-size: 12px; color: #555; word-break: break-all; margin: 8px 0; }
  button { background: #111; color: #fff; border: 0; padding: 10px 16px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>Your personal link</h1>
<p class="note">Tap "Copy link" next to your name and send it to your clients on WhatsApp.
Their selection will come straight to you.</p>
<div id="list"></div>

<script src="../js/advisors-data.js"></script>
<script>
var BASE = "https://www.eawishlist.com/";
function linkFor(a) {
  // Clean link: it forwards to the tracked link (see scripts/make_advisor_links.py)
  return BASE + a.id;
}

function copy(text, btn) {
  function done() {
    var old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = old; }, 1500);
  }
  function fallback() {
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand("copy"); done(); } catch (e) { window.prompt("Copy this link:", text); }
    document.body.removeChild(t);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

var list = document.getElementById("list");
(window.EA_ADVISORS || []).forEach(function (a) {
  var url = linkFor(a);
  var row = document.createElement("div");
  row.className = "row";

  var name = document.createElement("div");
  name.className = "name";
  name.textContent = a.name;
  row.appendChild(name);

  if (a.role) {
    var role = document.createElement("div");
    role.className = "role";
    role.textContent = a.role;
    row.appendChild(role);
  }

  var u = document.createElement("div");
  u.className = "url";
  u.textContent = url;
  row.appendChild(u);

  var b = document.createElement("button");
  b.type = "button";
  b.textContent = "Copy link";
  b.addEventListener("click", function () { copy(url, b); });
  row.appendChild(b);

  list.appendChild(row);
});
</script>
</body>
</html>
